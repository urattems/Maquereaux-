name: Release

# À chaque tag vX.Y.Z : build + tests, publication d'un Maquereaux.exe autonome, Release GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant à (re)publier, ex. v1.0.0"
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Déterminer le tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $version = $tag.TrimStart('v')
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c Release -p:Version=${{ steps.tag.outputs.version }}

      - name: Tests
        run: dotnet test -c Release --no-build --filter "Category!=Benchmark"

      - name: Publish (single-file, self-contained, win-x64)
        run: dotnet publish src/Maquereaux.App/Maquereaux.App.csproj -c Release -p:PublishSingleFile=true -p:Version=${{ steps.tag.outputs.version }} -o publish

      - name: Smoke test
        shell: pwsh
        run: ./build/Invoke-SmokeTest.ps1 -ExePath publish/Maquereaux.exe

      - name: Notes de release (depuis CHANGELOG.md)
        shell: pwsh
        run: ./build/Extract-ChangelogSection.ps1 -Version ${{ steps.tag.outputs.version }} -OutFile release-notes.md

      - name: Empreinte SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/Maquereaux.exe -Algorithm SHA256).Hash
          "$hash  Maquereaux.exe" | Out-File -Encoding ascii publish/Maquereaux.exe.sha256
          "" | Out-File -Append -Encoding utf8 release-notes.md
          "🔐 SHA-256 : ``$hash``" | Out-File -Append -Encoding utf8 release-notes.md

      - name: Créer / mettre à jour la Release GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          # Les versions 0.x sont marquées "pré-release" ; la v1.0.0 devient "Latest"
          $extra = @()
          if ($tag -match '^v0\.') { $extra += "--prerelease" }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag publish/Maquereaux.exe publish/Maquereaux.exe.sha256 --clobber
            gh release edit $tag --notes-file release-notes.md
          } else {
            gh release create $tag publish/Maquereaux.exe publish/Maquereaux.exe.sha256 --title "Maquereaux $tag" --notes-file release-notes.md @extra
          }
