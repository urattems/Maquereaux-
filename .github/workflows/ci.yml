name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build, tests & smoke test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Tests (unitaires + intégration Win32, hors benchmarks)
        run: dotnet test -c Release --no-build --filter "Category!=Benchmark" --logger "console;verbosity=normal" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Résumé couverture
        shell: pwsh
        run: |
          Get-ChildItem TestResults -Recurse -Filter coverage.cobertura.xml | ForEach-Object {
            [xml]$c = Get-Content $_.FullName
            foreach ($p in $c.coverage.packages.package) {
              $line = "{0}: lignes {1:P1}, branches {2:P1}" -f $p.name, [double]$p.'line-rate', [double]$p.'branch-rate'
              Write-Host $line
              "- $line" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            }
          }

      - name: Publish (single-file, self-contained, win-x64)
        run: dotnet publish src/Maquereaux.App/Maquereaux.App.csproj -c Release -p:PublishSingleFile=true -o publish

      - name: Smoke test de l'exe publié
        shell: pwsh
        run: ./build/Invoke-SmokeTest.ps1 -ExePath publish/Maquereaux.exe

      - name: Captures d'écran du smoke test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/maquereaux-smoke-data/screenshots/*.png
          if-no-files-found: warn
